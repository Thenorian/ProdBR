{% extends "base.html" %}
{% block title %}Produto — ProdBR{% endblock %}
{% block content %}
  <div id="product-root">
    <p class="empty">Carregando produto...</p>
  </div>

  {% if ads_snippet %}
    <div class="ad-slot ad-slot-inline">
      <span class="ad-label">Publicidade</span>
      {{ ads_snippet | safe }}
    </div>
  {% endif %}
{% endblock %}
{% block scripts %}
  <script>window.PRODUCT_ID = {{ product_id | tojson }};</script>
  <script src="/static/product.js"></script>
{% endblock %}
