{% extends "base.html" %}
{% block title %}NCM {{ ncm_code }} — ProdBR{% endblock %}
{% block content %}
  <div id="ncm-root">
    <p class="empty">Carregando NCM...</p>
  </div>

  {% if ads_snippet %}
    <div class="ad-slot ad-slot-inline">
      <span class="ad-label">Publicidade</span>
      {{ ads_snippet | safe }}
    </div>
  {% endif %}
{% endblock %}
{% block scripts %}
  <script>window.NCM_CODE = {{ ncm_code | tojson }};</script>
  <script src="/static/ncm_detail.js?v={{ static_v }}"></script>
{% endblock %}
