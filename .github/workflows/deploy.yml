name: Deploy

# Roda a cada push na main, e pode ser disparado manualmente (botao
# "Run workflow" / "Re-run job" na aba Actions do GitHub) - util quando
# o deploy falhou por instabilidade do servidor e so precisa tentar de
# novo, sem precisar de um commit novo.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/thenorian/prodbr

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Atualiza o container no servidor via SSH
        uses: appleboy/ssh-action@v1.0.3
        # Login no GHCR no servidor com o token DESTE repo antes do pull. Sem
        # isso o pull usava a credencial que sobrou do ultimo `docker login`
        # feito no servidor - o deploy do Simple ERP faz login com o token
        # dele (so vale pro pacote dele e expira) e sobrescreve - e dava
        # "error from registry: denied" (2026-10-07). Container antigo
        # continuava no ar porque o pull roda antes do stop.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          envs: GHCR_TOKEN,GHCR_USER
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull ghcr.io/thenorian/prodbr:latest

            docker stop prodbr 2>/dev/null || true
            docker rm prodbr 2>/dev/null || true

            # ~/prodbr.env e opcional - so existe se alguem customizou
            # alguma variavel (ver deploy/README.md). Sem ele, o app sobe
            # com os padroes definidos no Dockerfile.
            ENV_FLAG=""
            if [ -f "$HOME/prodbr.env" ]; then
              ENV_FLAG="--env-file $HOME/prodbr.env"
            fi

            docker run -d \
              --name prodbr \
              --restart unless-stopped \
              --network nginx_default \
              -v prodbr_data:/app/data \
              $ENV_FLAG \
              ghcr.io/thenorian/prodbr:latest

            docker image prune -f
